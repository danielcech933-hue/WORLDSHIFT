name: Build ROBLOX FORGE

on:
  push:
    branches: [main]
    paths:
      - 'tools/roblox-forge/**'
      - '.github/workflows/build-roblox-forge.yml'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/roblox-forge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Verify source integrity
        run: npm run verify

      - name: Build Windows installer and portable EXE
        run: npm run build:win

      - name: Upload ROBLOX FORGE release
        uses: actions/upload-artifact@v4
        with:
          name: ROBLOX-FORGE-Windows
          path: |
            tools/roblox-forge/dist/*.exe
            tools/roblox-forge/dist/*.blockmap
          if-no-files-found: error
