<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JARVIS</title>
<style>
:root{--cyan:#61e7ff;--blue:#448dff;--text:#f4f8ff;--muted:#91a2b9;--panel:rgba(5,10,18,.82);--line:rgba(100,180,255,.2)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;color:var(--text);font:14px Segoe UI,system-ui,sans-serif}
body{user-select:none}.app{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 52% 70%,rgba(28,108,190,.13),transparent 38%)}
.avatarWrap{position:absolute;right:28px;bottom:54px;width:285px;height:455px;filter:drop-shadow(0 12px 30px rgba(0,0,0,.55));animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.avatarGlow{position:absolute;left:35px;right:25px;bottom:8px;height:120px;background:radial-gradient(ellipse,rgba(65,190,255,.22),transparent 68%);filter:blur(12px)}
.avatar{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.eye{transform-origin:center;animation:blink 5s infinite}.eye.r{animation-delay:.08s}@keyframes blink{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(.08)}}
.mouth{transform-origin:center;animation:talk 3s ease-in-out infinite;animation-play-state:paused}.speaking .mouth{animation-play-state:running}@keyframes talk{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.panel{position:absolute;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);box-shadow:0 14px 40px rgba(0,0,0,.35);border-radius:16px}
.top{left:22px;top:20px;padding:10px 13px;display:flex;align-items:center;gap:9px}.logo{width:26px;height:26px;border:1px solid #5ee7ff99;border-radius:50%;position:relative;box-shadow:0 0 20px #5ee7ff44}.logo:after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 13px var(--cyan)}.brand{font-weight:800;letter-spacing:.22em;font-size:12px}.beta{font-size:9px;color:var(--cyan);letter-spacing:.12em}.dot{width:7px;height:7px;border-radius:50%;background:#48e38a;box-shadow:0 0 10px #48e38a;margin-left:4px}
.bubble{left:22px;top:108px;width:265px;padding:16px 18px;border-radius:18px}.bubble:after{content:"";position:absolute;right:-12px;bottom:18px;border:7px solid transparent;border-left-color:rgba(100,180,255,.2)}.who{font-size:10px;color:var(--cyan);letter-spacing:.16em;margin-bottom:6px}.reply{font-size:19px;line-height:1.3}.wave{display:flex;gap:3px;height:18px;align-items:center;margin-top:10px}.wave i{display:block;width:3px;height:8px;border-radius:3px;background:var(--cyan);animation:wave .8s infinite ease-in-out}.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}@keyframes wave{50%{height:17px}}
.menu{right:22px;top:20px;width:145px;padding:8px}.item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;color:#cdd9e8}.item.active{background:rgba(61,151,255,.12);color:white}.ico{width:20px;text-align:center}.item small{margin-left:auto;color:#49e28b}
.status{left:22px;bottom:22px;padding:9px 13px;color:#b6c5d8;font-size:11px}.status b{color:#4de394;font-weight:600}.mic{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);width:55px;height:55px;border-radius:50%;border:1px solid #61e7ff66;background:rgba(6,17,29,.9);color:var(--cyan);font-size:22px;box-shadow:0 0 28px rgba(70,190,255,.2);cursor:pointer}.mic.active{box-shadow:0 0 38px rgba(70,190,255,.55);background:rgba(15,50,75,.95)}
.actions{right:22px;bottom:22px;display:flex;gap:7px;padding:6px}.action{border:0;background:transparent;color:#9eb0c6;padding:7px 9px;border-radius:9px;cursor:pointer}.action:hover{background:#ffffff0d;color:white}.chatlog{position:absolute;left:22px;bottom:76px;width:335px;max-height:220px;overflow:auto;display:flex;flex-direction:column;gap:7px;padding-right:4px}.msg{max-width:95%;padding:9px 12px;border-radius:12px;background:rgba(6,12,21,.78);border:1px solid rgba(100,180,255,.12);line-height:1.4;white-space:pre-wrap}.msg.user{margin-left:auto;background:rgba(27,56,88,.78)}.thinking{color:#91a2b9;font-style:italic}.hidden{display:none!important}
#input{position:absolute;left:22px;bottom:20px;width:330px;height:52px;resize:none;border-radius:13px;border:1px solid var(--line);background:rgba(5,10,18,.9);color:white;padding:14px;outline:none;display:none}.mini{position:absolute;left:22px;top:72px;color:#75879e;font-size:10px}
@media(max-width:650px){.menu{display:none}.avatarWrap{right:5px;transform:scale(.88);transform-origin:bottom right}.bubble{left:10px;width:230px}.top,.status,.chatlog{left:10px}.chatlog{width:270px}}
</style>
</head>
<body><div class="app">
<div class="panel top"><div class="logo"></div><div><div class="brand">JARVIS</div><div class="beta">BETA • LIVE</div></div><span class="dot" id="dot"></span></div>
<div class="mini" id="project">WORLDSHIFT • CONNECTING…</div>
<div class="panel menu"><div class="item active"><span class="ico">💬</span>Chat</div><div class="item"><span class="ico">💻</span>PC</div><div class="item"><span class="ico">🎮</span>Roblox</div><div class="item"><span class="ico">🌐</span>Web</div><div class="item"><span class="ico">⚙</span>Nastavení</div></div>
<div class="panel bubble"><div class="who">JARVIS</div><div class="reply" id="reply">Jsem tady. Co potřebuješ?</div><div class="wave"><i></i><i></i><i></i><i></i><i></i></div></div>
<div class="chatlog" id="messages"></div>
<div class="panel status"><b id="state">● Online</b> <span id="activity">Připraven</span></div>
<button class="mic" id="mic" title="Mluvit">🎙</button>
<div class="panel actions"><button class="action" id="check">◉</button><button class="action" id="close">×</button></div>
<textarea id="input" placeholder="Napiš JARVISovi…"></textarea>
<div class="avatarWrap" id="avatarWrap"><div class="avatarGlow"></div>
<svg class="avatar" viewBox="0 0 300 470" aria-label="JARVIS anime avatar">
<defs><linearGradient id="hood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#172436"/><stop offset="1" stop-color="#050a12"/></linearGradient><linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe8dc"/><stop offset="1" stop-color="#d9b8b2"/></linearGradient><linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#182235"/><stop offset="1" stop-color="#05070c"/></linearGradient></defs>
<!-- body / hoodie --> <path d="M52 455c3-88 21-137 70-157l31 13 31-13c50 20 69 69 72 157H52z" fill="url(#hood)" stroke="#4b8fc0" stroke-opacity=".35"/><path d="M96 303c23 21 85 21 108 0" fill="none" stroke="#0a101b" stroke-width="22"/><path d="M113 316l-15 120M187 316l15 120" stroke="#5ee7ff" stroke-opacity=".16" stroke-width="3"/><path d="M151 336l-20 91M149 336l21 91" stroke="#0d1725" stroke-width="7"/>
<!-- neck --> <path d="M132 267v38c10 12 27 15 36 0v-38" fill="url(#skin)"/>
<!-- face --> <path d="M91 135c0-51 28-82 59-82 37 0 62 32 62 83v62c-8 49-34 74-62 74-31 0-54-25-59-74z" fill="url(#skin)" stroke="#6e879d" stroke-opacity=".3"/>
<!-- hair --> <path d="M89 153c-10-31-4-74 19-91 25-20 65-22 92 0 22 18 26 52 17 88l-17-36c-10 9-18 6-24-4-18 17-37 19-58 11-3 16-13 27-29 32z" fill="url(#hair)"/><path d="M102 91c13-25 45-40 76-25-23 2-35 13-46 29-9 12-19 18-30 19z" fill="#25334a" opacity=".7"/>
<!-- eyes --> <g class="eye"><ellipse cx="122" cy="177" rx="15" ry="18" fill="#101a29"/><ellipse cx="122" cy="177" rx="8" ry="11" fill="#79dfff"/><circle cx="125" cy="172" r="3" fill="white"/></g><g class="eye r"><ellipse cx="178" cy="177" rx="15" ry="18" fill="#101a29"/><ellipse cx="178" cy="177" rx="8" ry="11" fill="#79dfff"/><circle cx="181" cy="172" r="3" fill="white"/></g>
<!-- brows/nose --> <path d="M106 153q16-11 30 0M164 153q16-11 30 0" fill="none" stroke="#1a2230" stroke-width="5" stroke-linecap="round"/><path d="M149 181l-5 28 10 2" fill="none" stroke="#c99691" stroke-width="3" stroke-linecap="round"/>
<!-- mouth --> <ellipse class="mouth" cx="150" cy="229" rx="12" ry="5" fill="#7d4d59"/>
<!-- ear device --> <circle cx="203" cy="192" r="10" fill="#09111d" stroke="#61e7ff" stroke-width="2"/><circle cx="203" cy="192" r="4" fill="#61e7ff"/>
<!-- hands --> <path d="M91 345q-22 20-21 54 1 16 13 16 12 0 14-18l7-37z" fill="url(#skin)"/><path d="M209 345q22 20 21 54-1 16-13 16-12 0-14-18l-7-37z" fill="url(#skin)"/>
<!-- chest logo --> <path d="M150 331l15 28-15 28-15-28z" fill="none" stroke="#61e7ff" stroke-width="3"/><path d="M150 343v29" stroke="#61e7ff" stroke-width="3"/>
</svg></div>
</div>
<script>
const $=id=>document.getElementById(id);let recognition=null,listening=false,requests=0;
function add(text,who='assistant'){const e=document.createElement('div');e.className='msg '+who;e.textContent=text;$('messages').appendChild(e);$('messages').scrollTop=$('messages').scrollHeight;return e}
function speak(text){if(!('speechSynthesis'in window))return;const u=new SpeechSynthesisUtterance(String(text));u.lang='cs-CZ';u.rate=.98;u.pitch=1;u.onstart=()=>{$('avatarWrap').classList.add('speaking');$('activity').textContent='Mluvím…'};u.onend=()=>{$('avatarWrap').classList.remove('speaking');$('activity').textContent=requests?'Pracuji…':'Připraven'};window.speechSynthesis.cancel();window.speechSynthesis.speak(u)}
async function req(path,body){return window.jarvisDesktop.request(path,body)}
async function refresh(){try{const [p,r,s]=await Promise.all([window.jarvisDesktop.project(),window.jarvisDesktop.runtime(),req('/state')]);$('project').textContent=(p.projectRoot||'WORLDSHIFT').split('\\').pop()+' • ONLINE';$('state').textContent='● '+(r.backend?'Online':'Offline');$('dot').style.background=r.backend?'#48e38a':'#ffc857';if(!requests)$('activity').textContent=s.busy?'Pracuji…':'Připraven'}catch{$('state').textContent='● Offline';$('dot').style.background='#ffc857'}}
async function sendText(text){text=String(text||'').trim();if(!text)return;requests++;$('activity').textContent='Přemýšlím…';add(text,'user');$('reply').textContent='Chvíli přemýšlím…';const wait=add('JARVIS přemýšlí…','assistant thinking');try{const r=await req('/chat',{message:text,approve:false});wait.remove();const reply=r.reply||'Nemám odpověď.';add(reply);$('reply').textContent=reply.length>105?reply.slice(0,102)+'…':reply;speak(reply)}catch(e){wait.remove();add('Chyba: '+e.message);$('reply').textContent='Narazil jsem na chybu.';speak('Narazil jsem na chybu.')}finally{requests--;if(!requests)$('activity').textContent='Připraven'}}
$('mic').onclick=()=>{listening=!listening;$('mic').classList.toggle('active',listening);$('mic').textContent=listening?'🔴':'🎙';if(recognition){if(listening){try{recognition.start()}catch{}}else recognition.stop()}};
$('check').onclick=()=>sendText('Zkontroluj svůj systém, WORLDSHIFT, Forge, Roblox Studio a dostupné nástroje. Nic neměň, jen mi řekni stav.');
$('close').onclick=()=>window.jarvisDesktop.close?.();
if('webkitSpeechRecognition'in window){recognition=new webkitSpeechRecognition();recognition.lang='cs-CZ';recognition.continuous=true;recognition.interimResults=false;recognition.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){if(!e.results[i].isFinal)continue;const t=e.results[i][0].transcript.trim();if(/\bjarvis\b/i.test(t)){const cleaned=t.replace(/\bjarvis\b[,:;]?/ig,'').trim();if(cleaned)sendText(cleaned);else speak('Ano, co se děje?')}}};recognition.onend=()=>{if(listening){try{recognition.start()}catch{}}}}
refresh();setInterval(refresh,3000);
</script></body></html>
